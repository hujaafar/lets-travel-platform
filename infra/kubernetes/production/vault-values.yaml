global:
  tlsDisable: false
server:
  replicas: 3
  updateStrategyType: RollingUpdate
  disruptionBudget:
    enabled: true
    maxUnavailable: 1
  affinity: |
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: vault
          topologyKey: topology.kubernetes.io/zone
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = false
        listener "tcp" {
          address = "[::]:8200"
          cluster_address = "[::]:8201"
          tls_cert_file = "/vault/tls/tls.crt"
          tls_key_file = "/vault/tls/tls.key"
          tls_client_ca_file = "/vault/tls/ca.crt"
        }
        storage "raft" { path = "/vault/data" }
        service_registration "kubernetes" {}
  dataStorage:
    enabled: true
    size: 10Gi
    storageClass: multi-zone-block
  extraVolumes:
    - type: secret
      name: vault-tls
  extraVolumeMounts:
    - name: userconfig-vault-tls
      mountPath: /vault/tls
      readOnly: true
injector:
  enabled: false
ui:
  enabled: false
