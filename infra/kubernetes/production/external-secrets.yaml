# Requires External Secrets Operator and a Vault Kubernetes-auth role named
# travel-plan-external-secrets. Values are rendered into Kubernetes Secrets;
# no provider or database credentials belong in this repository.
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: travel-plan-vault
spec:
  provider:
    vault:
      server: https://vault-active.vault.svc.cluster.local:8200
      path: secret
      version: v2
      caProvider:
        type: Secret
        namespace: vault
        name: vault-tls
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: travel-plan-external-secrets
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: identity-runtime, namespace: travel-plan}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: travel-plan-vault}
  target:
    name: identity-runtime
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        TLS_PASSWORD: "{{ .TLS_PASSWORD }}"
        application.properties: |
          DB_PASSWORD={{ .DB_PASSWORD }}
          SERVICE_KEY={{ .SERVICE_KEY }}
          ADMIN_PASSWORD={{ .ADMIN_PASSWORD }}
  dataFrom:
    - extract: {key: identity}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: travel-runtime, namespace: travel-plan}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: travel-plan-vault}
  target:
    name: travel-runtime
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        TLS_PASSWORD: "{{ .TLS_PASSWORD }}"
        application.properties: |
          DB_PASSWORD={{ .DB_PASSWORD }}
          SERVICE_KEY={{ .SERVICE_KEY }}
          NEO4J_URI={{ .NEO4J_URI }}
          NEO4J_USER={{ .NEO4J_USER }}
          NEO4J_PASSWORD={{ .NEO4J_PASSWORD }}
  dataFrom:
    - extract: {key: travel}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata: {name: payments-runtime, namespace: travel-plan}
spec:
  refreshInterval: 1h
  secretStoreRef: {kind: ClusterSecretStore, name: travel-plan-vault}
  target:
    name: payments-runtime
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        TLS_PASSWORD: "{{ .TLS_PASSWORD }}"
        application.properties: |
          DB_PASSWORD={{ .DB_PASSWORD }}
          SERVICE_KEY={{ .SERVICE_KEY }}
          STRIPE_SECRET_KEY={{ .STRIPE_SECRET_KEY }}
          PAYPAL_CLIENT_ID={{ .PAYPAL_CLIENT_ID }}
          PAYPAL_CLIENT_SECRET={{ .PAYPAL_CLIENT_SECRET }}
  dataFrom:
    - extract: {key: payments}
