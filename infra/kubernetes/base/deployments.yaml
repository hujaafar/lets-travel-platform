apiVersion: apps/v1
kind: Deployment
metadata:
  name: dashboard
  namespace: travel-plan
spec:
  replicas: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: dashboard
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dashboard
        app.kubernetes.io/part-of: travel-plan
    spec:
      serviceAccountName: dashboard
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: dashboard}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: dashboard}
      containers:
        - name: dashboard
          image: travel-plan-dashboard:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - {name: https, containerPort: 8443}
          readinessProbe:
            httpGet: {scheme: HTTPS, path: /, port: https}
            periodSeconds: 10
          livenessProbe:
            httpGet: {scheme: HTTPS, path: /, port: https}
            periodSeconds: 20
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 192Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: dashboard-tls, mountPath: /certs, readOnly: true}
            - {name: dashboard-config, mountPath: /etc/caddy/Caddyfile, subPath: Caddyfile, readOnly: true}
            - {name: caddy-data, mountPath: /data}
            - {name: caddy-config, mountPath: /config}
      volumes:
        - name: dashboard-tls
          secret: {secretName: dashboard-tls}
        - name: dashboard-config
          configMap: {name: dashboard-caddy}
        - {name: caddy-data, emptyDir: {}}
        - {name: caddy-config, emptyDir: {}}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: identity
  namespace: travel-plan
spec:
  replicas: 3
  selector:
    matchLabels: {app.kubernetes.io/name: identity}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: identity
        app.kubernetes.io/part-of: travel-plan
    spec:
      serviceAccountName: identity
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: identity}
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: {app.kubernetes.io/name: identity}
      containers:
        - name: identity
          image: travel-plan-identity:1.0.0
          imagePullPolicy: IfNotPresent
          env:
            - {name: TLS_PASSWORD, valueFrom: {secretKeyRef: {name: identity-runtime, key: TLS_PASSWORD}}}
            - {name: APP_ORIGIN, value: "https://travel.example.com"}
          ports: [{name: https, containerPort: 8443}]
          readinessProbe: &ready
            httpGet: {scheme: HTTPS, path: /actuator/health/readiness, port: https}
            periodSeconds: 10
            failureThreshold: 6
          livenessProbe: &live
            httpGet: {scheme: HTTPS, path: /actuator/health/liveness, port: https}
            periodSeconds: 20
            failureThreshold: 3
          resources: &resources
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          securityContext: &containerSecurity
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
            readOnlyRootFilesystem: true
          volumeMounts:
            - {name: runtime, mountPath: /run/secrets, readOnly: true}
            - {name: tls, mountPath: /certs, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: runtime
          secret: {secretName: identity-runtime, items: [{key: application.properties, path: application.properties}]}
        - name: tls
          secret: {secretName: identity-tls}
        - {name: tmp, emptyDir: {}}
---
