# Build images from a fresh checkout without runtime secrets or service startup.
# Image tags match compose.yml so trusted integration jobs can reuse these builds.
services:
  identity:
    image: lets-travel-identity:1.0.0
    build:
      context: .
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE: identity
  travel:
    image: lets-travel-travel:1.0.0
    build:
      context: .
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE: travel
  payments:
    image: lets-travel-payments:1.0.0
    build:
      context: .
      dockerfile: infra/Dockerfile.service
      args:
        SERVICE: payments
  dashboard:
    image: lets-travel-dashboard:1.0.0
    build:
      context: .
      dockerfile: infra/Dockerfile.dashboard
