# Optional build-time trust for networks with an organization TLS proxy.
# BUILD_CA_FILE points to a PEM bundle exported from the host's trusted roots.
# This bundle is mounted only during package downloads, never added to images.
services:
  identity:
    build:
      secrets: [build_ca]
  travel:
    build:
      secrets: [build_ca]
  payments:
    build:
      secrets: [build_ca]
  dashboard:
    build:
      secrets: [build_ca]
secrets:
  build_ca:
    file: ${BUILD_CA_FILE:?Set BUILD_CA_FILE to a trusted PEM certificate bundle}
