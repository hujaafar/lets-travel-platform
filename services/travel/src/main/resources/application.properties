spring.application.name=travel
server.port=8443
spring.config.import=optional:file:/run/secrets/application.properties
server.ssl.enabled=true
server.ssl.key-store=file:/certs/travel.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=${TLS_PASSWORD}
spring.datasource.url=jdbc:postgresql://postgres:5432/travelplan?sslmode=verify-full&sslrootcert=/certs/ca.crt
spring.datasource.username=travel
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5
spring.neo4j.uri=${NEO4J_URI:bolt+s://neo4j:7687}
spring.neo4j.authentication.username=${NEO4J_USERNAME:neo4j}
spring.neo4j.authentication.password=${NEO4J_PASSWORD}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
logging.structured.format.console=logstash
server.error.include-message=never
server.error.include-stacktrace=never
app.origin=${APP_ORIGIN:https://localhost:8443}
app.service-key=${SERVICE_KEY}
app.auth-url=${APP_AUTH_URL:https://identity:8443}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

app.remote-auth=true
