# Opt-in tools. Run separately from the laptop dashboard if memory is limited.
services:
  jenkins:
    profiles: [tools]
    build: { context: ., dockerfile: infra/jenkins/Dockerfile }
    environment:
      JAVA_OPTS: -Xmx512m -Djenkins.install.runSetupWizard=false -Djavax.net.ssl.trustStore=/certs/truststore.p12 -Djavax.net.ssl.trustStorePassword=changeit
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?Run bootstrap.py}
      JENKINS_OPTS: --httpPort=-1 --httpsPort=8443 --httpsKeyStore=/certs/jenkins.p12 --httpsKeyStorePassword=${TLS_PASSWORD}
    ports: ["127.0.0.1:18443:8443"]
    volumes:
      [jenkins-data:/var/jenkins_home, ./.secrets/certs/jenkins:/certs:ro]
    networks: [egress]
    mem_limit: 768m
    restart: unless-stopped
  sonar-db:
    profiles: [tools]
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: sonar
      POSTGRES_DB: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?Run bootstrap.py}
    entrypoint: ["sh", "/bootstrap/entrypoint.sh"]
    volumes:
      - sonar-db:/var/lib/postgresql/data
      - ./.secrets/certs/postgres:/certs:ro
      - ./infra/postgres/entrypoint.sh:/bootstrap/entrypoint.sh:ro
      - ./infra/postgres/pg_hba.conf:/bootstrap/pg_hba.conf:ro
    networks: [sonar]
    mem_limit: 256m
    restart: unless-stopped
  sonarqube:
    profiles: [tools]
    image: sonarqube:community
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar?sslmode=verify-full&sslrootcert=/certs/ca.crt
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:?Run bootstrap.py}
      SONAR_WEB_HOST: 127.0.0.1
    volumes:
      [
        sonar-data:/opt/sonarqube/data,
        sonar-extensions:/opt/sonarqube/extensions,
        ./.secrets/certs/tools:/certs:ro,
      ]
    networks: [sonar, egress]
    ports: ["127.0.0.1:19443:9443"]
    depends_on: [sonar-db]
    mem_limit: 2g
    restart: unless-stopped
  sonar-tls:
    profiles: [tools]
    image: caddy:2.10-alpine
    network_mode: service:sonarqube
    volumes:
      [
        ./infra/sonar/Caddyfile:/etc/caddy/Caddyfile:ro,
        ./.secrets/certs/sonarqube:/certs:ro,
      ]
    depends_on: [sonarqube]
    mem_limit: 64m
    restart: unless-stopped
  loki:
    profiles: [monitoring]
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/config.yml
    volumes:
      [
        ./infra/observability/loki.yml:/etc/loki/config.yml:ro,
        loki-data:/loki,
        ./.secrets/certs/loki:/certs:ro,
      ]
    networks: [monitoring]
    mem_limit: 256m
    restart: unless-stopped
  log-collector:
    profiles: [monitoring]
    build: { context: ./infra/observability }
    environment: { COMPOSE_PROJECT: travel-plan }
    volumes:
      [
        /var/run/docker.sock:/var/run/docker.sock:ro,
        ./.secrets/ca.crt:/certs/ca.crt:ro,
      ]
    networks: [monitoring]
    depends_on: [loki]
    mem_limit: 64m
    restart: unless-stopped
  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.1.1
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Run bootstrap.py}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SERVER_PROTOCOL: https
      GF_SERVER_CERT_FILE: /certs/tls.crt
      GF_SERVER_CERT_KEY: /certs/tls.key
    volumes:
      [
        grafana-data:/var/lib/grafana,
        ./.secrets/grafana:/etc/grafana/provisioning:ro,
        ./.secrets/certs/tools:/certs:ro,
      ]
    ports: ["127.0.0.1:13443:3000"]
    networks: [monitoring, egress]
    depends_on: [loki]
    mem_limit: 192m
    restart: unless-stopped
networks:
  sonar: { internal: true }
  monitoring: { internal: true }
volumes:
  jenkins-data: {}
  sonar-db: {}
  sonar-data: {}
  sonar-extensions: {}
  loki-data: {}
  grafana-data: {}
